<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond carré arrondi violet DEERA -->
  <rect width="100" height="100" rx="20" fill="#5746e3"/>
  <!-- Toit de la maison -->
  <polygon points="50,14 88,52 12,52" fill="white"/>
  <!-- Corps de la maison -->
  <rect x="22" y="50" width="56" height="38" fill="white" rx="3"/>
  <!-- Porte -->
  <rect x="37" y="63" width="26" height="25" fill="#5746e3" rx="3"/>
  <!-- Point connecté (vert) au sommet du toit -->
  <circle cx="50" cy="13" r="8" fill="#22c55e" stroke="white" stroke-width="3"/>
</svg>
